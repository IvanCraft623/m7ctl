[package]
name = "m7ctl"
version = "0.1.0"
edition = "2021"
description = "Controller for the Machenike M7 Pro mouse (DPI, polling rate, buttons, lighting, macros)"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dirs = "7.0.0"
notify-rust = "4.19.0"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }

[profile.release]
opt-level = 2
strip = true
